name: Datenbankprüfung
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ZAEME_TEST_STACK: integration
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:upgrade:check
      - run: npm run db:upgrade:shopping
      - run: npm run db:test
      - run: npm run db:test:api
      - run: npm run db:test:shopping
      - run: npm run db:test:realtime
      - run: npm run db:types:check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:scanner:browser
      - run: npm run test:browser
      - run: npm run test:pwa
      - if: always()
        run: npm run db:stop
